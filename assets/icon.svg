<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Atomic mark: 4 orbital ellipses crossing at center -->
  <g
    fill="none"
    stroke="#595959"
    stroke-width="5"
    stroke-linecap="round"
    transform="translate(50 50)"
  >
    <ellipse rx="38" ry="14" transform="rotate(0)"/>
    <ellipse rx="38" ry="14" transform="rotate(45)"/>
    <ellipse rx="38" ry="14" transform="rotate(90)"/>
    <ellipse rx="38" ry="14" transform="rotate(135)"/>
  </g>
  <circle cx="50" cy="50" r="5.5" fill="#595959"/>
</svg>
